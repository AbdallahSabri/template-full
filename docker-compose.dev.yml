# Dev infrastructure for the reusable template.
# The Next.js app itself runs on the host via `pnpm dev`, not in here.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up                                   # postgres only
#   docker compose -f docker-compose.dev.yml --profile redis up                   # + redis
#   docker compose -f docker-compose.dev.yml --profile queue up                   # + rabbitmq
#   docker compose -f docker-compose.dev.yml --profile storage up                 # + minio (auto-creates bucket)
#   docker compose -f docker-compose.dev.yml --profile redis --profile queue --profile storage up
#
# All services use `restart: "no"` — a stopped container stays stopped,
# it will not come back on its own after a crash or a Docker/host restart.
#
#   docker compose -f docker-compose.dev.yml stop redis     # stop just redis
#   docker compose -f docker-compose.dev.yml start redis    # bring it back
#   docker compose -f docker-compose.dev.yml up -d redis    # same, if the container doesn't exist yet
#
# Bringing the rest of the stack up again does not restart something you
# stopped on purpose, as long as you scope the command to what you need —
# e.g. `docker compose --profile storage up -d` won't touch redis if you
# don't pass `--profile redis` too. Postgres is the one exception: it has
# no profile, so it's always in scope and will come back with any `up`.
#
# Matches the env vars in .env.example — defaults below are dev-only, never
# reuse them anywhere near production.

services:
  postgres:
    image: postgres:18-alpine
    container_name: template-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_dev

  redis:
    image: redis:8-alpine
    container_name: template-redis
    restart: "no"
    profiles: ["redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REDIS_URL=redis://localhost:6379

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: template-rabbitmq
    restart: "no"
    profiles: ["queue"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI — http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    # RABBITMQ_URL=amqp://guest:guest@localhost:5672

  minio:
    image: minio/minio:latest
    container_name: template-minio
    restart: "no"
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # console — http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    # S3_ENDPOINT=http://localhost:9000
    # S3_REGION=us-east-1 (MinIO ignores region but the SDK still wants one)
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as above

  # One-shot: creates the dev bucket so the app doesn't 404 on first upload.
  minio-init:
    image: minio/mc:latest
    container_name: template-minio-init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-app-dev}
      "
    # S3_BUCKET=app-dev

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data: